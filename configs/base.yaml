# Proyecto Vitali — Base Configuration

project:
  name: "proyecto-vitali"
  version: "0.1.0"
  seed: 42

paths:
  raw: "data/raw"
  sanitized: "data/sanitized"
  interim: "data/interim"
  processed: "data/processed"
  external: "data/external"
  artifacts: "artifacts"

data:
  # Completar en Fase 2 después de inspeccionar el raw
  # source_file: "reservations.csv"
  # date_column: "check_in"
  # price_column: "nightly_rate"
  # currency: "USD"  # o "CRC"

income_data:
  source_file: "data/external/DatosVitali_ingresos_anonimizados.csv"
  date_columns:
    - "movement_date"
    - "booking_date"
    - "check_in"
    - "check_out"
  required_columns:
    - "record_type"
    - "movement_date"
    - "booking_date"
    - "check_in"
    - "check_out"
    - "nights"
    - "unit_id"
    - "currency"
    - "net_amount"
    - "service_fee"
    - "cleaning_fee"
    - "gross_income"
    - "booking_lead_days"
  allowed_record_types:
    - "reservation"
    - "resolution_payment"
  allowed_currencies:
    - "USD"
    - "CRC"

fx_normalization:
  enabled: false
  strategy: "preserve_original"
  target_currency: "CRC"
  rates_to_crc: {}

modeling:
  test_window_months: 1
  min_train_months: 6
  confidence_level: 0.95

wandb:
  project: "proyecto-vitali"
  entity: null  # Completar con usuario W&B
